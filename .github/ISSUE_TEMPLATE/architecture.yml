name: Architecture proposal
description: Suggest a public-safe architecture improvement for OAI-2.0
title: "[Architecture] "
labels: ["architecture"]
body:
  - type: markdown
    attributes:
      value: |
        Keep proposals public-safe. Do not include credentials, private endpoints, private infrastructure, sensitive datasets, or private provider arrangements.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What engineering problem should this architecture change solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed architecture
      description: Describe the design, interfaces, and expected behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / references
      description: Link primary sources, benchmarks, prior art, or reproducible evidence.
