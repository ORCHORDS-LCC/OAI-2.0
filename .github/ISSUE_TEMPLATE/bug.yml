name: Documentation or architecture bug
description: Report an incorrect, broken, outdated, or contradictory public document
title: "[Docs] "
labels: ["documentation"]
body:
  - type: input
    id: path
    attributes:
      label: Document / path
      placeholder: docs/agent-architecture/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is incorrect or broken?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected correction
  - type: textarea
    id: sources
    attributes:
      label: Public sources
      description: Prefer current primary/vendor references.
