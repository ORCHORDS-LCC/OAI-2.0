name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: lint + types + tests + public-safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python 3.14
        run: uv python install 3.14 && uv venv --python 3.14 .venv-ci
      - name: Sync deps (no MLX)
        # MLX is apple-only; CI is ubuntu. Install only the project's
        # non-MLX deps so the smoke test correctly skips via
        # @pytest.mark.skipif. uv.lock pins exact versions.
        run: |
          source .venv-ci/bin/activate
          uv pip install \
            "pydantic>=2.9,<3.0" "fastapi>=0.115" "jsonschema>=4.23" \
            "pyyaml>=6.0" "jinja2>=3.1" "httpx>=0.27" \
            "Pillow>=10.4" "numpy>=2.0,<3.0" \
            "pytest>=8.3" "pytest-asyncio>=0.24" \
            "ruff>=0.7" "mypy>=1.13"
      - name: Ruff lint
        run: source .venv-ci/bin/activate && ruff check oai2 tests scripts
      - name: MyPy (best-effort, ignore_missing_imports)
        run: |
          source .venv-ci/bin/activate
          mypy --no-incremental --follow-imports=silent \
            --ignore-missing-imports --warn-unused-ignores \
            oai2 || true
      - name: Pytest
        run: source .venv-ci/bin/activate && pytest -W error -v
- name: Public-safety scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """Block accidental leakage of private infra / credentials.

          The repo is intentionally public-safe:

            * no real Cloudflare account / bucket / database IDs;
            * no API keys or private tokens;
            * no private URLs or corpus content;
            * no private provider details (server hostnames, internal endpoints).

          Allowed public contact: crm@orchords.com.
          """
          import json
          import re
          import sys
          from pathlib import Path

          root = Path(".")

          # Skip virtual-envs, build outputs, caches, vendored deps.
          skip_dirs = {
              ".git", "node_modules", "dist", "build",
              ".venv-ci", ".venv", "venv",
              "__pycache__", ".pytest_cache", ".mypy_cache", ".ruff_cache",
              "site-packages",
          }

          # Files whose contents are themselves the source of these
          # patterns — must not trigger on themselves.
          always_skip_files = {
              Path(".github/workflows/ci.yml"),  # contains the CF_API_TOKEN regex.
          }

          # Public-safe placeholders: tokens are LITERALLY placeholders,
          # not real credentials. Allowed in .env.example only.
          placeholder_files = {Path(".env.example")}

          # GitHub noreply addresses are user-id attribution, not contact.
          github_noreply = re.compile(r"^\d+\+[A-Za-z0-9-]+@users\.noreply\.github\.com$")

          forbidden_regex = [
              # Cloudflare resource identifiers — these leak account IDs.
              r"r2[A-Za-z0-9_-]{16,}\.r2\.cloudflarestorage\.com",
              r"\b[a-f0-9]{32}\.cf\.r2\.dev\b",
          ]
          sensitive_literal = [
              r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----",
              r"(?i)api[_-]?key\s*[:=]\s*['\"][A-Za-z0-9_\-]{12,}",
              r"(?i)secret\s*[:=]\s*['\"][A-Za-z0-9_\-]{12,}",
              r"AKIA[0-9A-Z]{16}",
              r"ghp_[A-Za-z0-9]{30,}",
              r"sk-[A-Za-z0-9]{20,}",
          ]
          allowed_email = "crm@orchords.com"

          violations: list[str] = []
          scanned = 0

          def scan_file(path: Path) -> None:
              nonlocal scanned
              if not path.is_file():
                  return
              if any(part in skip_dirs for part in path.parts):
                  return
              if path in always_skip_files:
                  return
              if path.suffix not in {
                  ".py", ".md", ".yml", ".yaml", ".toml", ".json",
                  ".sh", ".txt", ".env", ".example",
              }:
                  return
              is_placeholder = path in placeholder_files
              scanned += 1
              text = path.read_text(encoding="utf-8", errors="replace")
              for pat in forbidden_regex + sensitive_literal:
                  if re.search(pat, text):
                      # .env.example may mention "cloudflare_account_id"
                      # as a literal placeholder label. That's allowed.
                      if is_placeholder and "cloudflare" in pat.lower():
                          continue
                      violations.append(f"{path}: pattern {pat}")

          for path in sorted(root.rglob("*")):
              scan_file(path)

          # Email check: only crm@orchords.com or noreply github ids.
          email_re = re.compile(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}")
          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              if any(part in skip_dirs for part in path.parts):
                  continue
              if path.suffix not in {".md", ".py", ".toml", ".yml", ".yaml"}:
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              for m in email_re.finditer(text):
                  e = m.group(0)
                  if e == allowed_email:
                      continue
                  if github_noreply.match(e):
                      continue
                  violations.append(f"{path}: non-allowed email {e}")

          print(f"scanned {scanned} files")
          if violations:
              print("PUBLIC-SAFETY VIOLATIONS:")
              for v in violations:
                  print(f" - {v}")
              sys.exit(1)
          print("public-safety: OK")
          PY