name: Documentation quality

# Direct uploads to main are the canonical workflow; the runner should
# not fire on those. Runs when a pull request touches documentation or
# when manually dispatched via the Actions tab.
on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/docs-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          md_files = list(Path(".").rglob("*.md"))
          if not md_files:
              raise SystemExit("No Markdown files found")

          bad = []
          link_re = re.compile(r"\[[^\]]*\]\(([^)]+)\)")
          sensitive = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"(?i)api[_-]?key\s*[:=]\s*['\"][^'\"]+"),
              re.compile(r"(?i)secret\s*[:=]\s*['\"][^'\"]+"),
          ]

          for path in md_files:
              text = path.read_text(encoding="utf-8")
              for pat in sensitive:
                  if pat.search(text):
                      bad.append(f"{path}: possible sensitive literal")
              for target in link_re.findall(text):
                  target = target.strip()
                  if not target or target.startswith(("#", "http://", "https://", "mailto:")):
                      continue
                  clean = target.split("#", 1)[0]
                  if clean and not (path.parent / clean).resolve().exists():
                      bad.append(f"{path}: broken relative link -> {target}")

          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print(f"Checked {len(md_files)} Markdown files.")
          PY
