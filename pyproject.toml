[project]
name = "oai2"
version = "0.1.0"
description = "OAI-2.0 — compact, fast, code- and vision-native agent for Apple Silicon."
authors = [
    { name = "ORCHORDS.COM", email = "72497645+ORCHORDS@users.noreply.github.com" },
]
license = { text = "Non-Commercial License v1.0 (see ./LICENSE)" }
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # MLX inference / Apple Silicon
    "mlx==0.32.3",
    "mlx-lm==0.32.0",

    # Model + data handling
    "numpy>=2.0,<3.0",
    "transformers>=5.7.0,<6.0",
    "tokenizers>=0.21.0",
    "safetensors>=0.5.0",
    "huggingface_hub>=0.34.0",
    "sentencepiece>=0.2.0",
    "protobuf>=5.0,<7.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",

    # Schemas / types
    "pydantic>=2.9,<3.0",
    "jsonschema>=4.23",

    # Runtime
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",

    # Vision
    "Pillow>=10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
    "types-requests",
    "types-protobuf",
]

[project.urls]
Homepage = "https://github.com/ORCHORDS-LCC/OAI-2.0"
Issues = "https://github.com/ORCHORDS-LCC/OAI-2.0/issues"
Contact = "mailto:crm@orchords.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oai2"]

[tool.hatch.build.targets.sdist]
include = [
    "oai2/**/*.py",
    "README.md",
    "LICENSE",
    "docs/**/*.md",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"